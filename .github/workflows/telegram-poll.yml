# لینک‌یار — polling تقریباً ۲۴ساعته روی GitHub Actions
# هر جاب حدود ۵ ساعت زنده می‌ماند و مدام تلگرام را چک می‌کند.
# هر ۴ ساعت یک جاب تازه می‌آید تا اگر قبلی قطع شد دوباره بالا بیاید.
name: Telegram poll

on:
  schedule:
    # هر ۴ ساعت؛ خودِ cron گیت‌هاب دقیق نیست، برای همین جاب طولانی می‌ماند
    - cron: "0 */4 * * *"
    # پشتیبان وسط روز/شب
    - cron: "30 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-poll
  # جاب قبلی را وسط کار نکش (مخصوصاً دانلود فایل بزرگ)
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Poll Telegram (keep-alive)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          STORAGE_BACKEND: github
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          FILE_TTL_HOURS: "6"
          ADMIN_USER_IDS: "6325075744"
          MAX_FILE_BYTES: "2147483648"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # ~۵ ساعت حلقه مداوم
          POLL_LOOP_MS: "18000000"
          POLL_INTERVAL_MS: "2000"
          CLEANUP_INTERVAL_MS: "300000"
        run: npm run poll

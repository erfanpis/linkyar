# لینک‌یار ۲۴ساعته:
# - long-polling فوری (جواب چندثانیه‌ای)
# - هر جاب ~۵ ساعت زنده است
# - آخر کار با RESPAWN_PAT خودش جاب بعدی را روشن می‌کند (زنجیره بی‌نهایت)
name: Telegram poll

on:
  schedule:
    # پشتیبان اگر زنجیره یک‌بار قطع شد
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run bot (instant long-polling, ~5 hours)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          STORAGE_BACKEND: github
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          FILE_TTL_HOURS: "6"
          ADMIN_USER_IDS: "6325075744"
          MAX_FILE_BYTES: "2147483648"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          PORT: "38471"
        run: |
          # بعد از ۵ ساعت با SIGINT خاموش می‌شود تا جاب بعدی بیاید
          timeout --signal=SIGINT 18000 npm start || code=$?
          # 124 = timeout معمولی
          if [ "${code:-0}" = "124" ] || [ "${code:-0}" = "0" ]; then
            exit 0
          fi
          exit "${code:-1}"

      - name: Respawn next keep-alive job
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RESPAWN_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RESPAWN_PAT missing — نمی‌توانم خودم را دوباره روشن کنم"
            exit 0
          fi
          gh workflow run "telegram-poll.yml" --repo "$GITHUB_REPOSITORY"
          echo "respawn requested"

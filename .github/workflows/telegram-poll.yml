# ربات بدون VPS: هر ۵ دقیقه یک جاب ~۴.۵ دقیقه‌ای اجرا می‌شود
# و هر ۲.۵ ثانیه تلگرام را چک می‌کند (پاسخ نزدیک به زنده).
#
# نیازها:
# - ریپو Public (لینک دانلود + Actions رایگان)
# - Secret: TELEGRAM_BOT_TOKEN
name: Telegram poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Poll Telegram (loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          STORAGE_BACKEND: github
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          FILE_TTL_HOURS: "12"
          MAX_FILE_BYTES: "104857600"
          TELEGRAM_MAX_FILE_BYTES: "20971520"
          # ~۴ دقیقه و ۴۵ ثانیه حلقه
          POLL_LOOP_MS: "285000"
          POLL_INTERVAL_MS: "2500"
        run: npm run poll

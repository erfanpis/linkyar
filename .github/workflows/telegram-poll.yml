# ربات بدون VPS روی GitHub Actions
# فایل را می‌گیرد، تا ۲ گیگ با MTProto دانلود می‌کند، لینک می‌دهد.
name: Telegram poll

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-poll
  # هرگز جاب قبلی را وسط دانلود فایل بزرگ نکش
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Poll Telegram (loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          STORAGE_BACKEND: github
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          FILE_TTL_HOURS: "12"
          MAX_FILE_BYTES: "2147483648"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          POLL_LOOP_MS: "110000"
          POLL_INTERVAL_MS: "2000"
        run: npm run poll
